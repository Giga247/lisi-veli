<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ლისი ველი</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!--
  ეკრანისგან დამოუკიდებელი — screen-app-ის შიგნით რომ ყოფილიყო, UI.showError
  ხმას ვერ გასცემდა loading/signin/pending ეკრანებზე, სადაც screen-app
  [hidden]-ითაა დამალული და მისი შვილებიც არ ჩანს.
-->
<div id="error-box" hidden></div>

<div id="screen-loading" class="screen">
  <p>იტვირთება…</p>
</div>

<div id="screen-signin" class="screen" hidden>
  <h1>ლისი ველი</h1>
  <figure class="plan">
    <img src="data/plan.svg" width="1100" height="1202"
         alt="ლისი ველის უბნის გეგმა: რვა ქუჩა, 66 საკადასტრო ნაკვეთი ნაგებობების კონტურებით და მისამართებით.">
    <figcaption>გზები და ნაგებობები: © OpenStreetMap-ის მონაწილეები (ODbL)</figcaption>
  </figure>
  <p>სისტემაში შესასვლელად გაიარეთ ავტორიზაცია Google-ით.</p>
  <div id="signin-button"></div>
</div>

<div id="screen-pending" class="screen" hidden>
  <h1>ლისი ველი</h1>
  <p id="pending-message">თქვენი მოთხოვნა დამტკიცების პროცესშია.</p>
  <button onclick="Auth.signOut()">გასვლა</button>
</div>

<div id="screen-app" class="screen" hidden>
  <header>
    <h1>ლისი ველი</h1>
    <nav>
      <button id="tab-table" onclick="UI.showTab('table')">ცხრილი</button>
      <button id="tab-map" onclick="UI.showTab('map')">რუკა</button>
      <button id="tab-admin" onclick="UI.showTab('admin')" hidden>ადმინი</button>
    </nav>
    <span id="whoami"></span>
    <button onclick="Auth.signOut()">გასვლა</button>
  </header>

  <section id="panel-table"></section>
  <section id="panel-map" hidden></section>
  <section id="panel-admin" hidden></section>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script src="js/lib.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/table.js"></script>
<script src="js/map.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
